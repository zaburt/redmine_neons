<svg xmlns="http://www.w3.org/2000/svg" width="410" height="130" viewBox="0 0 410 130">
  <defs>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowMagenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="4" y="34" width="56" height="56" rx="12" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#glowCyan)"/>
  <rect x="18" y="48" width="28" height="28" rx="6" fill="none" stroke="#FF2BD6" stroke-width="3" filter="url(#glowMagenta)"/>
  <circle cx="32" cy="62" r="5" fill="#FF8C1A" filter="url(#glowOrange)"/>

  <text x="78" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700"
        fill="#00F0FF" filter="url(#glowCyan)">Neo<tspan fill="#FF2BD6" filter="url(#glowMagenta)">ns</tspan></text>

  <text x="79" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" letter-spacing="3"
        fill="#B967FF">REDMINE THEME</text>
</svg>
